[project]
name = "kambo"
version = "0.1.0"
description = "MCP Server for automated pentest and bug bounty operations using Kali Linux containers"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # Pinned below 2.0: the 2.x SDK dropped the low-level decorator API
    # (@server.list_tools/call_tool/list_resources/read_resource/
    # list_prompts/get_prompt) that kambo.server is wired against, and
    # replaced it with on_*= constructor callbacks. Lifting this pin
    # requires porting server.py first — see tests/test_mcp_contract.py.
    "mcp[cli]>=1.0.0,<2",
    "docker>=7.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "aiofiles>=24.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
kambo = "kambo.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kambo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-json-report>=1.5.0",
]
