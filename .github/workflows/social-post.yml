name: Kambo Social Post — 18h BRT

on:
  schedule:
    # 21h UTC = 18h BRT (UTC-3)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Dia específico (1-30). Deixe vazio para usar o dia do ciclo."
        required: false
        default: ""
      dry_run:
        description: "Dry-run (não publica, só exibe o texto)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  post:
    name: Publicar post do dia
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: social-media

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: social-media/requirements-social.txt

      - name: Instalar dependências
        run: pip install -r requirements-social.txt

      - name: Calcular dia do ciclo
        id: day
        env:
          # Configure em: Settings → Variables → Actions → KAMBO_START_DATE
          # Formato: YYYY-MM-DD  (ex: 2026-06-18)
          KAMBO_START_DATE: ${{ vars.KAMBO_START_DATE || '2026-06-18' }}
        run: |
          if [[ -n "${{ github.event.inputs.day }}" ]]; then
            echo "number=${{ github.event.inputs.day }}" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY'
          from datetime import date
          import os
          start = date.fromisoformat(os.environ["KAMBO_START_DATE"])
          diff = (date.today() - start).days
          day = (diff % 30) + 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"number={day}\n")
          print(f"📅 Dia do ciclo: {day}/30 (início: {start})")
          PY
          fi

      - name: Exibir post do dia
        env:
          POSTER_MODE: ${{ vars.POSTER_MODE || 'api' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python poster.py day ${{ steps.day.outputs.number }} --dry-run

      - name: Publicar no Threads via API
        if: >
          github.event.inputs.dry_run != 'true' &&
          secrets.THREADS_ACCESS_TOKEN != ''
        env:
          POSTER_MODE: api
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          python poster.py day ${{ steps.day.outputs.number }}

      - name: Aviso — credenciais não configuradas
        if: >
          github.event.inputs.dry_run != 'true' &&
          secrets.THREADS_ACCESS_TOKEN == ''
        run: |
          echo ""
          echo "⚠️  THREADS_ACCESS_TOKEN não configurado."
          echo ""
          echo "Para ativar a publicação automática:"
          echo "  1. Acesse: Settings → Secrets and variables → Actions"
          echo "  2. Adicione os secrets:"
          echo "     THREADS_USER_ID       — seu ID de usuário no Threads"
          echo "     THREADS_ACCESS_TOKEN  — token de acesso longo (60 dias)"
          echo ""
          echo "  Para obter os tokens:"
          echo "    https://developers.facebook.com/docs/threads/get-started"
          echo ""
          echo "  Sem o token, a workflow exibirá o post no log"
          echo "  mas NÃO publicará automaticamente."
