name: regression-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (first pass)
        run: |
          mkdir -p .reports
          pytest --json-report --json-report-file=.reports/current.json -q || true

      - name: Re-run failed tests for flake detection
        run: |
          # Re-run only the tests that failed so we can detect flakes cheaply.
          python -c "
          import json, pathlib, sys
          data = json.loads(pathlib.Path('.reports/current.json').read_text())
          ids = [t['nodeid'] for t in data.get('tests', []) if t.get('outcome') in ('failed','error')]
          pathlib.Path('.reports/failed-ids.txt').write_text('\n'.join(ids))
          print(f'{len(ids)} failed tests to re-run')
          "
          if [ -s .reports/failed-ids.txt ]; then
            pytest --json-report --json-report-file=.reports/rerun.json -q \
              $(cat .reports/failed-ids.txt) || true
          else
            echo '{"tests": []}' > .reports/rerun.json
          fi

      - name: Download baseline from main
        id: baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: tests.yml
          name: baseline-report
          branch: main
          path: .reports/baseline/
          if_no_artifact_found: warn

      - name: Analyze regressions
        id: analyze
        run: |
          baseline_arg=""
          if [ -f .reports/baseline/report.json ]; then
            baseline_arg="--baseline .reports/baseline/report.json"
          else
            echo "No baseline available — skipping regression comparison."
          fi
          set +e
          python -m tests.regression_validator analyze \
            --current .reports/current.json \
            --rerun .reports/rerun.json \
            $baseline_arg \
            --markdown .reports/summary.md
          echo "validator_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat .reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: regression-validator
          path: .reports/summary.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports
          path: .reports/
          retention-days: 14

      - name: Fail on real regression
        # exit code 2 from the validator = regression detected
        if: steps.analyze.outputs.validator_exit == '2'
        run: |
          echo "::error::Regression detected — see PR comment for details."
          exit 1
