name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full-matrix run at 03:17 UTC so flakes show up over time.
    - cron: "17 3 * * *"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on PRs: one OS, current Python only.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          mkdir -p .reports
          pytest --json-report --json-report-file=.reports/report.json -q
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-quick
          path: .reports/report.json
          retention-days: 14

  # Full matrix on main, nightly, and manual runs.
  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Bleeding-edge: report results but don't block.
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          mkdir -p .reports
          pytest --json-report --json-report-file=.reports/report.json \
                 --cov=src/kambo --cov-report=xml -q
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .reports/report.json
            coverage.xml
          retention-days: 30

  # On pushes to main, promote the report so PRs have a baseline to compare against.
  promote-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pytest-report-ubuntu-latest-py3.13
          path: .reports/
      - name: Upload as baseline
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: .reports/report.json
          retention-days: 90
