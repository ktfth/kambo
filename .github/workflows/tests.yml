name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full-matrix run at 03:17 UTC so flakes show up over time.
    - cron: "17 3 * * *"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on PRs: one OS, current Python only.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Diagnose env
        run: |
          python --version
          which python
          which pytest || true
          python -m pytest --version
          python -c "import kambo; print('kambo from:', kambo.__file__)"
      - name: Run tests
        run: |
          mkdir -p .reports
          python -m pytest --json-report --json-report-file=.reports/report.json -q
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-quick
          path: .reports/report.json
          retention-days: 14

  # Full matrix on main, nightly, and manual runs.
  matrix:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Bleeding-edge: report results but don't block.
          - os: ubuntu-latest
            python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          allow-prereleases: true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        shell: bash
        run: |
          mkdir -p .reports
          python -m pytest --json-report --json-report-file=.reports/report.json \
                 --cov=src/kambo --cov-report=xml -q
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .reports/report.json
            coverage.xml
          retention-days: 30

  # A red cron has no audience. That is how a broken nightly sat unnoticed from
  # late May to the end of August: the matrix failed every night and the only
  # record was a red dot nobody opens. File it where the agents already look.
  # `cancelled` counts as failing — a job killed by its own timeout is how a
  # hang reports itself, and that is exactly the case worth waking someone for.
  report-nightly-failure:
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.matrix.result == 'failure' || needs.matrix.result == 'cancelled')
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_RESULT: ${{ needs.matrix.result }}
        run: |
          set -euo pipefail

          gh label create ci-nightly --color d73a4a \
            --description "Scheduled test matrix is failing on main" || true

          body=$(printf '%s\n' \
            "The scheduled test matrix finished as \`$MATRIX_RESULT\` on \`main\`." \
            "" \
            "- Run: $RUN_URL" \
            "- Commit: \`$GITHUB_SHA\`" \
            "" \
            "A \`cancelled\` result usually means a job hit its timeout. Check" \
            "whether the tests actually passed and the process then failed to" \
            "exit, rather than assuming a test failure.")

          existing=$(gh issue list --state open --label ci-nightly \
                       --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::Nightly still red — commented on issue #$existing"
          else
            url=$(gh issue create --title "Nightly test matrix is red on main" \
                    --label ci-nightly --label bug --body "$body")
            echo "::notice::Opened nightly-failure issue: $url"
          fi

  # Close the alarm when the nightly goes green again, so an open ci-nightly
  # issue always means the matrix is red right now.
  resolve-nightly-failure:
    if: github.event_name == 'schedule' && needs.matrix.result == 'success'
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close any open nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for number in $(gh issue list --state open --label ci-nightly \
                            --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Nightly matrix is green again: $RUN_URL"
            echo "::notice::Closed nightly-failure issue #$number"
          done

  # On pushes to main, promote the report so PRs have a baseline to compare against.
  promote-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pytest-report-ubuntu-latest-py3.13
          path: .reports/
      - name: Upload as baseline
        uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: .reports/report.json
          retention-days: 90
